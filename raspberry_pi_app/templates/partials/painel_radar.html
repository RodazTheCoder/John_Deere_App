<div class="panel-block pb-radar">
  <div class="panel-title">Rosa dos ventos</div>
  <div class="radar-zoom">
    <span>Zoom</span>
    <div class="radar-zoom-track">
      <input type="range" id="radarZoomSlider" min="2" max="160" step="1" value="160">
    </div>
    <span id="radarZoomValor" class="radar-zoom-valor">160 m</span>
  </div>
  <div class="radar-wrap">
    <div class="radar" id="radar">
      <div class="sweep"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <span class="compass-label cl-n">FRENTE</span>
      <span class="compass-label cl-s">TRÁS</span>
      <span class="compass-label cl-e">DIR</span>
      <span class="compass-label cl-w">ESQ</span>
      <div class="own-tractor">▲</div>
      <!-- blips injected by JS -->
    </div>
  </div>
</div>
