<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centralizador de Dados</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --panel-soft: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --success: #22c55e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        background: var(--panel);
        border-bottom: 1px solid rgba(148,163,184,0.25);
      }
      .title { font-weight: bold; font-size: 1.2rem; }
      .status-pill {
        background: rgba(34,197,94,0.12);
        color: #bbf7d0;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(34,197,94,0.35);
      }
      .layout {
        display: flex;
        min-height: calc(100vh - 70px);
      }
      .sidebar {
        width: 360px;
        background: var(--panel);
        border-right: 1px solid rgba(148,163,184,0.25);
        padding: 18px 16px;
      }
      .card {
        background: var(--panel-soft);
        border-radius: 12px;
        border: 1px solid rgba(148,163,184,0.18);
        padding: 12px 14px;
        margin-bottom: 14px;
      }
      .card h3 { margin: 0 0 10px; }
      .veiculo-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 48vh;
        overflow: auto;
      }
      .veiculo-item {
        background: rgba(15, 23, 42, 0.5);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .map-area { flex: 1; position: relative; }
      #map { width: 100%; height: 100%; min-height: 500px; }
      .legend { font-size: 0.8rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="title">Centralizador de Dados - Plantação</div>
      <div class="status-pill" id="status-live">Conectado</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="card">
          <h3>Veículos em tempo real</h3>
          <div id="veiculos-list" class="veiculo-list"></div>
        </div>
      </aside>

      <main class="map-area">
        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const map = L.map('map').setView([-23.5505, -46.6333], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const markers = new Map();
      const historyLines = new Map();

      function renderVeiculos(veiculos) {
        const list = document.getElementById('veiculos-list');
        list.innerHTML = '';
        if (!veiculos.length) {
          list.innerHTML = '<div class="legend">Nenhum veículo ativo.</div>';
          return;
        }

        veiculos.forEach((veiculo) => {
          const item = document.createElement('div');
          item.className = 'veiculo-item';
          item.innerHTML = `
            <strong>${veiculo.nome}</strong>
            <div>Tipo: ${veiculo.tipo}</div>
            <div>Velocidade: ${Number(veiculo.velocidade_kmh || 0).toFixed(1)} km/h</div>
            <div>Status: ${veiculo.status}</div>
            <div>Lat/Lon: ${Number(veiculo.latitude).toFixed(5)}, ${Number(veiculo.longitude).toFixed(5)}</div>
          `;
          list.appendChild(item);
        });
      }

      function desenharHistorico(veiculoId, historico) {
        const coords = (historico || []).map((p) => [p.latitude, p.longitude]);
        if (coords.length < 2) return;

        if (historyLines.has(veiculoId)) {
          map.removeLayer(historyLines.get(veiculoId));
        }

        const line = L.polyline(coords, { color: '#38bdf8', weight: 2, opacity: 0.8 }).addTo(map);
        historyLines.set(veiculoId, line);
      }

      function updateMap(veiculos) {
        const idsAtuais = new Set(veiculos.map((veiculo) => veiculo.id));

        markers.forEach((marker, id) => {
          if (!idsAtuais.has(id)) {
            map.removeLayer(marker);
            markers.delete(id);
          }
        });

        historyLines.forEach((linha, id) => {
          if (!idsAtuais.has(id)) {
            map.removeLayer(linha);
            historyLines.delete(id);
          }
        });

        veiculos.forEach((veiculo) => {
          const position = [veiculo.latitude, veiculo.longitude];
          desenharHistorico(veiculo.id, veiculo.historico || []);

          if (markers.has(veiculo.id)) {
            const marker = markers.get(veiculo.id);
            marker.setLatLng(position);
            marker.bindPopup(`<strong>${veiculo.nome}</strong><br>Tipo: ${veiculo.tipo}<br>Velocidade: ${Number(veiculo.velocidade_kmh || 0).toFixed(1)} km/h`);
            return;
          }

          const marker = L.circleMarker(position, {
            radius: 9,
            color: '#38bdf8',
            fillColor: '#38bdf8',
            fillOpacity: 0.8,
            weight: 2
          }).addTo(map);

          marker.bindPopup(`<strong>${veiculo.nome}</strong><br>Tipo: ${veiculo.tipo}<br>Velocidade: ${Number(veiculo.velocidade_kmh || 0).toFixed(1)} km/h`);
          markers.set(veiculo.id, marker);
        });
      }

      async function carregarDados() {
        try {
          const veiculosResponse = await fetch('/api/veiculos');
          const veiculos = (await veiculosResponse.json()).veiculos || [];

          renderVeiculos(veiculos);
          updateMap(veiculos);
        } catch (error) {
          console.error('Erro ao carregar dados:', error);
        }
      }

      setInterval(carregarDados, 3000);
      carregarDados();
    </script>
  </body>
</html>
